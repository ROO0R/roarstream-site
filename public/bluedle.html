<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>The Daily Bluedle | Roarstream.com</title>
  <link rel="icon" href="/pacMM.png" type="image/png">
  <link rel="preload" href="Chronotype.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Chronotype';
      src: url('Chronotype.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap; 
    }
    :root{
      --accent:#1f4f9a; --accent2:#2f6fd0; --accent3:#7ec4ff;
      --right:#2f7fe0; --wrong:#d64545;
      --text:#f3f8ff; --muted:#b8c9e0;
      --border:rgba(255,255,255,.12);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html{ -webkit-text-size-adjust:100%; }
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:'Chronotype', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:#070b14; 
      padding: max(14px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .panel{
      max-width:920px;
      margin:0 auto;
      background:#111320;
      border:1px solid var(--border);
      border-radius:16px;
      padding:clamp(14px, 3vw, 32px);
    }
    h1{
      margin:0 0 6px;
      font-size:clamp(26px, 6vw, 48px);
      line-height:1.1;
      text-align:center;
      color:#cfe4ff;
    }
    .intro{
      text-align:center;
      color:var(--muted);
      margin:0 0 16px;
      line-height:1.4;
      font-size:clamp(14px, 3.6vw, 17px);
    }

    .video{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      border-radius:12px;
      overflow:hidden;
      background:#000;
      border:1px solid var(--border);
    }
    .video iframe, .play{
      position:absolute; inset:0; width:100%; height:100%; border:0;
    }
    .play{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
      background:linear-gradient(180deg,#0f1f3a,#08101d);
      color:var(--text);
      font:inherit;
      cursor:pointer;
      padding:0;
    }
    .play .icon{
      width:68px; height:68px; border-radius:50%;
      background:var(--accent2);
      display:flex; align-items:center; justify-content:center;
    }
    .play .icon::before{
      content:""; margin-left:6px;
      border-style:solid; border-width:13px 0 13px 22px;
      border-color:transparent transparent transparent #fff;
    }
    .play span{ color:var(--muted); font-size:15px; }
    .play:focus-visible{ outline:3px solid var(--accent3); outline-offset:-3px; }

    .updated{ margin:12px 0 0; text-align:center; color:var(--muted); font-size:14px; }
    .updated b{ color:var(--accent3); }

    .tracker{ margin-top:20px; text-align:center; }
    .pips{
      display:grid;
      grid-template-columns:repeat(10, 1fr);
      gap:8px;
      max-width:620px;
      margin:0 auto;
    }
    .pip{
      aspect-ratio:1;
      width:100%;
      padding:0;
      border-radius:10px;
      border:2px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.06);
      color:#fff;
      font:inherit;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      touch-action:manipulation;
    }
    .pip:active{ opacity:.7; }
    .pip:focus-visible{ outline:3px solid var(--accent3); outline-offset:2px; }
    .pip[data-state="right"]{ background:var(--right); border-color:#8ac4f0; }
    .pip[data-state="wrong"]{ background:var(--wrong); border-color:#ff9a9a; }

    .score{ margin:12px 0 0; color:var(--muted); font-size:16px; }
    .score b{ color:var(--accent3); }
    .row{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:14px; }

    .cta{
      display:inline-flex; align-items:center; justify-content:center;
      min-height:46px;
      padding:12px 18px;
      border-radius:12px;
      text-decoration:none;
      font:inherit; font-weight:700; font-size:16px;
      color:#fff;
      border:1px solid rgba(255,255,255,.14);
      background:var(--accent2);
      cursor:pointer;
      touch-action:manipulation;
    }
    .cta.secondary{ background:rgba(255,255,255,.1); }
    .cta:active{ opacity:.8; }
    .cta:focus-visible{ outline:3px solid var(--accent3); outline-offset:3px; }

    .toast{ min-height:22px; margin:10px 0 0; color:var(--accent3); font-size:15px; visibility:hidden; }
    .toast.show{ visibility:visible; }
    .toast.err{ color:#ff9a9a; }

    .links{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:20px 0 4px; }

    /* Phones: bigger tap targets (5 x 2 grid), full-width buttons */
    @media (max-width:520px){
      .pips{ grid-template-columns:repeat(5, 1fr); gap:10px; max-width:340px; }
      .pip{ font-size:20px; }
      .row .cta, .links .cta{ flex:1 1 100%; }
      .panel{ border-radius:14px; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>The Daily Bluedle</h1>
    <p class="intro">Welcome to <i>Bluedle</i>: the Bluey guessing game where you're given a random screenshot from a Bluey episode and have to figure out which episode it came from!</p>

    <div class="video" id="videoBox">
      <button type="button" class="play" id="playBtn" aria-label="Load and play the Bluedle video">
        <div class="icon"></div>
        <span>Tap to play</span>
      </button>
    </div>

    <p class="updated" id="updated" hidden></p>

    <section class="tracker" aria-label="Score tracker">
      <div class="pips" id="pips"></div>
      <p class="score" id="score" aria-live="polite"></p>
      <div class="row">
        <button type="button" class="cta" id="shareBtn">Share results</button>
        <button type="button" class="cta secondary" id="resetBtn">Reset</button>
      </div>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </section>

    <div class="links">
      <a class="cta" id="channelLink" href="#" target="_blank" rel="noopener noreferrer">Bluedle YouTube Archive</a>
      <a class="cta secondary" href="index.html">← Back to Roarstream.com</a>
    </div>
  </main>

  <script>
  (function(){
    var CHANNEL_ID = "UCFsTDZp1LkHOI9d1y0xw0cQ";

    var $ = function(id){ return document.getElementById(id); };
    var box = $("videoBox"), playBtn = $("playBtn"), updatedEl = $("updated");
    var pipsEl = $("pips"), scoreEl = $("score"), toastEl = $("toast");

    var STATES = ["none","right","wrong"];
    var EMOJI  = { none:"⬜", right:"🟦", wrong:"🟥" };
    var LABEL  = { none:"no answer", right:"right", wrong:"wrong" };
    var results = [];
    for (var k = 0; k < 10; k++) results.push("none");

    function count(s){ return results.filter(function(r){ return r === s; }).length; }
    function renderScore(){
      scoreEl.innerHTML = "<b>" + count("right") + "</b> right · <b>" + count("wrong") + "</b> wrong";
    }

    // Build pips in one go (single DOM insert)
    var frag = document.createDocumentFragment();
    var pipEls = results.map(function(_, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "pip";
      b.textContent = i + 1;
      b.dataset.i = i;
      frag.appendChild(b);
      return b;
    });
    pipsEl.appendChild(frag);

    function sync(i){
      pipEls[i].dataset.state = results[i];
      pipEls[i].setAttribute("aria-label", "Question " + (i + 1) + ": " + LABEL[results[i]]);
    }
    results.forEach(function(_, i){ sync(i); });
    renderScore();

    // One delegated listener instead of ten
    pipsEl.addEventListener("click", function(e){
      var b = e.target.closest(".pip");
      if (!b) return;
      var i = +b.dataset.i;
      results[i] = STATES[(STATES.indexOf(results[i]) + 1) % 3];
      sync(i);
      renderScore();
    });

    $("resetBtn").addEventListener("click", function(){
      results.fill("none");
      results.forEach(function(_, i){ sync(i); });
      renderScore();
      showToast("Score reset.");
    });

    var toastTimer;
    function showToast(text, isErr){
      toastEl.textContent = text;
      toastEl.classList.toggle("err", !!isErr);
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2800);
    }

    async function copyText(text){
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (!ok) throw new Error("copy failed");
    }

    $("shareBtn").addEventListener("click", async function(){
      var answered = results.filter(function(r){ return r !== "none"; }).length;
      var today = new Date().toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
      var text = "The Daily Bluedle – " + today + "\n" +
        results.map(function(r){ return EMOJI[r]; }).join("") + "\n" +
        count("right") + "/" + (answered || 10) + "\n" +
        "https://bluedle.roarstream.com";
      try {
        if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) {
          await navigator.share({ text: text });
        } else {
          await copyText(text);
          showToast("Results copied to clipboard!");
        }
      } catch (e) {
        if (e && e.name === "AbortError") return; // user closed share sheet
        try { await copyText(text); showToast("Results copied to clipboard!"); }
        catch (e2) { showToast("Couldn't copy. Please try again.", true); }
      }
    });

    function timeAgo(date){
      var s = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
      var units = [["year",31536000],["month",2592000],["day",86400],["hour",3600],["minute",60]];
      for (var i = 0; i < units.length; i++){
        var n = Math.floor(s / units[i][1]);
        if (n >= 1) return n + " " + units[i][0] + (n > 1 ? "s" : "") + " ago";
      }
      return "just now";
    }

    if (!/^UC[\w-]{22}$/.test(CHANNEL_ID)) {
      playBtn.querySelector("span").textContent = "Set CHANNEL_ID in the script.";
      return;
    }

    var uploadsId = "UULF" + CHANNEL_ID.slice(2);
    $("channelLink").href = "https://www.youtube.com/channel/" + CHANNEL_ID;

    var warmed = false;
    function warm(){
      if (warmed) return; warmed = true;
      var l = document.createElement("link");
      l.rel = "preconnect"; l.href = "https://www.youtube-nocookie.com";
      document.head.appendChild(l);
    }
    playBtn.addEventListener("pointerenter", warm, { once:true });
    playBtn.addEventListener("touchstart", warm, { once:true, passive:true });

    playBtn.addEventListener("click", function(){
      var iframe = document.createElement("iframe");
      iframe.src = "https://www.youtube-nocookie.com/embed/videoseries?list=" + uploadsId + "&autoplay=1&playsinline=1";
      iframe.title = "Latest YouTube video";
      iframe.allow = "autoplay; accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      box.replaceChildren(iframe);
    });

    // ---- "Last updated" (deferred, cached 1h so repeat visits make no request) ----
    function show(ts){
      var d = new Date(ts);
      updatedEl.innerHTML = "Last updated: <b>" +
        d.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" }) +
        "</b> (" + timeAgo(d) + ")";
      updatedEl.hidden = false;
    }
    async function loadDate(){
      try {
        var cached = JSON.parse(localStorage.getItem("bluedleUpdated") || "null");
        if (cached && Date.now() - cached.at < 3600000) { show(cached.ts); return; }
      } catch (e) {}
      try {
        var feed = "https://www.youtube.com/feeds/videos.xml?playlist_id=" + uploadsId;
        var res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feed));
        var data = await res.json();
        if (data.status !== "ok" || !data.items || !data.items.length) return;
        var ts = Math.max.apply(null, data.items.map(function(i){
          return new Date(i.pubDate.replace(" ", "T") + "Z").getTime();
        }));
        show(ts);
        try { localStorage.setItem("bluedleUpdated", JSON.stringify({ ts:ts, at:Date.now() })); } catch (e) {}
      } catch (e) { /* fail silently */ }
    }
    var idle = window.requestIdleCallback || function(f){ return setTimeout(f, 1200); };
    idle(loadDate);
  })();
  </script>
</body>
</html>
