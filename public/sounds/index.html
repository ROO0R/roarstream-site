<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/pacMM.png" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roarstream Sounds</title>

<style>
:root{
--accent:#1f6f3a;
--bg0:#05070a;
--bg1:#070d0a;
--text:#f3fff7;
--muted:#b8d6c3;
--border:rgba(255,255,255,.12);
--shadow:0 18px 60px rgba(0,0,0,.55);
--radius:18px;
--chip:rgba(255,255,255,.06);
}

.searchWrap{
display:flex;
justify-content:center;
margin:0 0 18px;
}

.latestSound{
font-weight:700;
color:#7ee2a8;
}
  
.searchInput{
width:min(100%, 520px);
padding:12px 14px;
border-radius:14px;
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.06);
color:var(--text);
font-size:15px;
outline:none;
box-shadow:0 6px 18px rgba(0,0,0,.20);
}

.searchInput::placeholder{
color:var(--muted);
}

.searchInput:focus{
border-color:rgba(126,226,168,.45);
box-shadow:0 0 0 3px rgba(126,226,168,.12);
}
  
body{
margin:0;
color:var(--text);
font-family:Arial, Helvetica, sans-serif;
background:
radial-gradient(1200px 700px at 50% 20%, rgba(31,111,58,.25), transparent 55%),
linear-gradient(180deg, var(--bg0), var(--bg1));
}

.stage{
min-height:100vh;
display:grid;
grid-template-columns:1fr minmax(320px,1000px) 1fr;
padding:28px 18px;
}

.panel{
background:linear-gradient(180deg, rgba(20,20,39,.92), rgba(15,15,24,.92));
border:1px solid var(--border);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:30px;
}

.glowtext{
text-align:center;
font-size:48px;
margin-bottom:6px;
background:linear-gradient(90deg,#fff,#7ee2a8,#fff);
-webkit-background-clip:text;
color:transparent;
}

.subhead{
text-align:center;
color:var(--muted);
margin-bottom:20px;
white-space:pre-line;
}

.commandGrid{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:12px;
margin-top:16px;
}

.copyToggleWrap{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin:10px 0 10px;
padding:10px 14px;
border:1px solid rgba(255,255,255,.10);
border-radius:14px;
background:rgba(255,255,255,.04);
width:fit-content;
margin-left:auto;
margin-right:auto;
flex-wrap:wrap;
}

.randomBtn{
min-height:auto;
padding:10px 14px;
font-size:14px;
width:auto;
white-space:nowrap;
}

.infoPanel{
margin:12px auto 18px;
padding:18px;
border-radius:18px;
background:
linear-gradient(
180deg,
rgba(40,40,60,.92),
rgba(18,18,28,.95)
);

border:1px solid rgba(126,226,168,.18);

max-width:620px;
color:var(--text);

box-shadow:
0 12px 30px rgba(0,0,0,.35),
0 0 0 1px rgba(255,255,255,.03) inset;

transition:all .15s ease;
}

.infoPanel .name{
font-size:24px;
font-weight:800;
letter-spacing:.5px;
color:#7ee2a8;
margin-bottom:14px;
text-align:center;

padding-bottom:10px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.infoRow{
margin-bottom:14px;
padding:10px 12px;
border-radius:12px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.05);
}

.infoLabel{
font-size:11px;
font-weight:700;
text-transform:uppercase;
letter-spacing:1.2px;
color:#8fbfa2;
margin-bottom:6px;
opacity:.9;
}

.infoValue{
font-size:15px;
line-height:1.5;
color:#f3fff7;
word-break:break-word;
}

.infoCategory{
display:inline-block;
padding:4px 10px;
border-radius:999px;
background:rgba(126,226,168,.14);
border:1px solid rgba(126,226,168,.25);
font-weight:700;
color:#9ef0bf;
font-size:13px;
}

.copyToggleWrap label{
color:var(--text);
font-size:14px;
cursor:pointer;
user-select:none;
}

.copyToggle{
width:18px;
height:18px;
cursor:pointer;
accent-color:var(--accent);
}

@media (max-width:900px){
.commandGrid{
grid-template-columns:repeat(2,1fr);
}
}

@media (max-width:600px){
.commandGrid{
grid-template-columns:1fr;
}
}

.cmd{
padding:14px 16px;
border-radius:14px;
background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
border:1px solid rgba(255,255,255,.10);
font-family:Consolas, monospace;
font-size:14px;
line-height:1.25;
text-align:center;
min-height:54px;
display:flex;
align-items:center;
justify-content:center;
transition:all .15s ease;
box-shadow:0 6px 18px rgba(0,0,0,.25);
cursor:pointer;
color:var(--text);
width:100%;
}
  
.cmd:hover{
transform:translateY(-2px);
background:linear-gradient(180deg, rgba(126,226,168,.18), rgba(126,226,168,.05));
border-color:rgba(126,226,168,.35);
}

.cmd.copied{
border-color:rgba(126,226,168,.75);
background:linear-gradient(180deg, rgba(126,226,168,.28), rgba(126,226,168,.10));
}

footer{
margin-top:20px;
border-top:1px solid rgba(255,255,255,.10);
padding-top:10px;
display:flex;
justify-content:space-between;
flex-wrap:wrap;
}

.smallLink{
color:var(--muted);
text-decoration:none;
margin-right:12px;
}

.stickyTop{
position:sticky;
top:0;
z-index:100;
padding-top:10px;
padding-bottom:14px;

background:linear-gradient(
180deg,
rgba(15,15,24,.96) 0%,
rgba(15,15,24,.92) 80%,
rgba(15,15,24,0) 100%
);

backdrop-filter:blur(10px);
}
  
</style>
</head>

<body>
<div class="stage">
<main class="panel">

<h1 class="glowtext">RS Sound Effects</h1>

<p class="subhead" id="subheadText">Loading Sounds...</p>

<div class="stickyTop">

  <div class="copyToggleWrap">
    <input type="checkbox" id="bangToggle" class="copyToggle">
    <label for="bangToggle">Add ! prefix to copy/paste</label>

    <button id="randomBtn" class="cmd randomBtn">
      🎲 Random Sound
    </button>
  </div>

  <div id="infoPanel" class="infoPanel">
    <div class="name">Select a sound</div>
    <div class="meta">Click on sound to see details</div>
  </div>

  <div class="searchWrap">
    <input
      type="text"
      id="searchInput"
      class="searchInput"
      placeholder="Search sounds..."
    >
  </div>

</div>

<div class="commandGrid" id="commandGrid"></div>

<footer>
<div>© Roarstream</div>
<div>
<a class="smallLink" href="https://www.roarstream.com">Back</a>
<a class="smallLink" href="https://twitch.roarstream.com">Twitch</a>
<a class="smallLink" href="https://youtube.roarstream.com">Youtube</a>
</div>
</footer>

</main>
</div>

<script>
const grid = document.getElementById("commandGrid");
const sub = document.getElementById("subheadText");
const bangToggle = document.getElementById("bangToggle");
const searchInput = document.getElementById("searchInput");
const infoPanel = document.getElementById("infoPanel");
const randomBtn = document.getElementById("randomBtn");

let allSounds = [];
let currentFilteredSounds = [];
let defaultSubhead = "";
let currentSelectedSound = null;

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    return false;
  }
}

function showCopyFeedback(el, originalSound, ok, copiedValue) {
  el.innerHTML = ok ? `Copied:<br>${copiedValue}` : `Copy failed`;
  el.classList.add("copied");

  setTimeout(() => {
    el.textContent = originalSound;
    el.classList.remove("copied");
  }, 900);
}

function buildSearchQuery(sound) {
  const cleanDescription = (sound.description || "")
    .replace(/^"+|"+$/g, "")
    .replace(/^'+|'+$/g, "")
    .replace(/[']/g, "")
    .trim();

  return `${sound.category} ${cleanDescription}`.trim();
}

function openSearches(sound) {
  const query = encodeURIComponent(buildSearchQuery(sound));

  const googleUrl =
    `https://www.google.com/search?q=${query}`;

  const youtubeUrl =
    `https://www.youtube.com/results?search_query=${query}`;

  window.open(googleUrl, "_blank");
  window.open(youtubeUrl, "_blank");
}

function updateInfo(sound) {
  currentSelectedSound = sound;

  const cleanDescription = (sound.description || "")
    .replace(/^"+|"+$/g, "")
    .trim();

  infoPanel.innerHTML = `
    <div class="name">${sound.name}</div>

    <div class="infoRow">
      <div class="infoLabel">Category</div>
      <div class="infoValue">
        <span class="infoCategory">
          ${sound.category || "Unknown"}
        </span>
      </div>
    </div>

    <div class="infoRow">
      <div class="infoLabel">Description</div>
      <div class="infoValue" id="descText"></div>
    </div>

    <div style="text-align:center; margin-top:16px;">
      <button id="searchSourceBtn" class="cmd randomBtn">
        🔎 Search Source
      </button>
    </div>
  `;

  document.getElementById("descText").textContent =
    cleanDescription || "No description available.";

  const searchBtn = document.getElementById("searchSourceBtn");

  searchBtn.addEventListener("click", () => {
    openSearches(sound);
  });
}

function renderSounds(filter = "") {
  const query = filter.toLowerCase();

  currentFilteredSounds = !query
    ? [...allSounds]
    : allSounds.filter(s =>
        (s.name || "").toLowerCase().includes(query) ||
        (s.description || "").toLowerCase().includes(query) ||
        (s.category || "").toLowerCase().includes(query)
      );

  grid.innerHTML = "";

  currentFilteredSounds.forEach(sound => {
    const el = document.createElement("button");

    el.className = "cmd";
    el.textContent = sound.name;

    el.addEventListener("click", async () => {
      updateInfo(sound);

      const copiedValue = bangToggle.checked
        ? `!${sound.name}`
        : sound.name;

      const ok = await copyText(copiedValue);

      showCopyFeedback(el, sound.name, ok, copiedValue);
    });

    grid.appendChild(el);
  });

  sub.innerHTML = query
    ? `${currentFilteredSounds.length} match${currentFilteredSounds.length === 1 ? "" : "es"}`
    : defaultSubhead;
}

randomBtn.addEventListener("click", async () => {
  if (!currentFilteredSounds.length) return;

  const sound =
    currentFilteredSounds[
      Math.floor(Math.random() * currentFilteredSounds.length)
    ];

  updateInfo(sound);

  const copiedValue = bangToggle.checked
    ? `!${sound.name}`
    : sound.name;

  const ok = await copyText(copiedValue);

  const originalText = randomBtn.innerHTML;

  randomBtn.innerHTML = ok
    ? `Copied:<br>${copiedValue}`
    : `Copy failed`;

  randomBtn.classList.add("copied");

  setTimeout(() => {
    randomBtn.innerHTML = originalText;
    randomBtn.classList.remove("copied");
  }, 900);
});

function parse(text) {
  const sourceSounds = text
    .split("\n")
    .map(x => x.trim())
    .filter(Boolean)
    .map(line => {
      const parts = line.split("||");

      return {
        name: (parts[0] || "").replace(".ogg", "").trim(),
        category: (parts[1] || "Unknown").trim(),
        description: (parts[2] || "No description available.").trim(),
      };
    })
    .filter(s => s.name);

  const total = sourceSounds.length;
  const latest = sourceSounds[sourceSounds.length - 1]?.name;

  allSounds = sourceSounds.sort((a, b) =>
    a.name.localeCompare(b.name, undefined, { numeric: true })
  );

  defaultSubhead =
    `Click on a bubble to copy it for pasting into Twitch chat.\n\nLast Update: ${total} — <span class="latestSound">${latest}</span>`;

  renderSounds();

  searchInput.addEventListener("input", e =>
    renderSounds(e.target.value)
  );
}

fetch("sounds.txt")
  .then(r => r.text())
  .then(text => parse(text))
  .catch(err => {
    sub.textContent =
      "Failed to load sounds.txt — check the console.";

    console.error(err);
  });
</script>
</body>
</html>
