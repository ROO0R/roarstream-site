<meta charset="UTF-8">

<title>Roarstream Sound Effects</title>

<style>
:root{
--accent:#1f6f3a;
--bg0:#05070a;
--bg1:#070d0a;
--text:#f3fff7;
--muted:#b8d6c3;
--border:rgba(255,255,255,.12);
--shadow:0 18px 60px rgba(0,0,0,.55);
--radius:18px;
--chip:rgba(255,255,255,.06);
}

.searchWrap{
display:flex;
justify-content:center;
margin:0 0 18px;
}

.latestSound{
font-weight:700;
color:#7ee2a8;
}
  
.searchInput{
width:min(100%, 520px);
padding:12px 14px;
border-radius:14px;
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.06);
color:var(--text);
font-size:15px;
outline:none;
box-shadow:0 6px 18px rgba(0,0,0,.20);
}

.searchInput::placeholder{
color:var(--muted);
}

.searchInput:focus{
border-color:rgba(126,226,168,.45);
box-shadow:0 0 0 3px rgba(126,226,168,.12);
}
  
body{
margin:0;
color:var(--text);
font-family:Arial, Helvetica, sans-serif;
background:
radial-gradient(1200px 700px at 50% 20%, rgba(31,111,58,.25), transparent 55%),
linear-gradient(180deg, var(--bg0), var(--bg1));
}

.stage{
min-height:100vh;
display:grid;
grid-template-columns:1fr minmax(320px,1000px) 1fr;
padding:28px 18px;
}

.panel{
background:linear-gradient(180deg, rgba(20,20,39,.92), rgba(15,15,24,.92));
border:1px solid var(--border);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:30px;
}

.glowtext{
text-align:center;
font-size:48px;
margin-bottom:6px;
background:linear-gradient(90deg,#fff,#7ee2a8,#fff);
-webkit-background-clip:text;
color:transparent;
}

.subhead{
text-align:center;
color:var(--muted);
margin-bottom:20px;
white-space:pre-line;
}

.commandGrid{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:12px;
margin-top:16px;
}

.copyToggleWrap{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin:10px 0 18px;
padding:10px 14px;
border:1px solid rgba(255,255,255,.10);
border-radius:14px;
background:rgba(255,255,255,.04);
width:fit-content;
margin-left:auto;
margin-right:auto;
}

.copyToggleWrap label{
color:var(--text);
font-size:14px;
cursor:pointer;
user-select:none;
}

.copyToggle{
width:18px;
height:18px;
cursor:pointer;
accent-color:var(--accent);
}

  
@media (max-width:900px){
.commandGrid{
grid-template-columns:repeat(2,1fr);
}
}

@media (max-width:600px){
.commandGrid{
grid-template-columns:1fr;
}
}

.cmd{
padding:14px 16px;
border-radius:14px;
background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
border:1px solid rgba(255,255,255,.10);
font-family:Consolas, monospace;
font-size:14px;
line-height:1.25;
text-align:center;
white-space:normal;
overflow-wrap:normal;
word-break:normal;
hyphens:none;
min-height:54px;
display:flex;
align-items:center;
justify-content:center;
transition:all .15s ease;
box-shadow:0 6px 18px rgba(0,0,0,.25);
cursor:pointer;
appearance:none;
-webkit-appearance:none;
color:var(--text);
width:100%;
}
  
.cmd:hover{
transform:translateY(-2px);
background:linear-gradient(180deg, rgba(126,226,168,.18), rgba(126,226,168,.05));
border-color:rgba(126,226,168,.35);
box-shadow:0 10px 24px rgba(0,0,0,.35);
}

.cmd.copied{
border-color:rgba(126,226,168,.75);
background:linear-gradient(180deg, rgba(126,226,168,.28), rgba(126,226,168,.10));
}

footer{
margin-top:20px;
border-top:1px solid rgba(255,255,255,.10);
padding-top:10px;
display:flex;
justify-content:space-between;
flex-wrap:wrap;
}

.smallLink{
color:var(--muted);
text-decoration:none;
margin-right:12px;
}
</style>

</head>
<body>

<div class="stage">

<main class="panel">

<h1 class="glowtext">RS Sound Effects</h1>

<p class="subhead" id="subheadText">
Loading Sounds...
</p>

<div class="copyToggleWrap">
  <input type="checkbox" id="bangToggle" class="copyToggle">
  <label for="bangToggle">(Twitch Subs) Add ! prefix</label>
</div>


<div class="searchWrap">
  <input
    type="text"
    id="searchInput"
    class="searchInput"
    placeholder="Search sounds..."
    autocomplete="off"
    spellcheck="false"
  >
</div>
  
<div class="commandGrid" id="commandGrid"></div>
  
<footer>
<div>
© Roarstream
</div>

<div>
<a class="smallLink" href="https://www.roarstream.com">Back</a>
<a class="smallLink" href="https://www.twitch.tv/RoarWuzTaken">Twitch</a>
<a class="smallLink" href="https://www.youtube.com/@RoarWuzTaken">YouTube</a>
</div>
</footer>

</main>

</div>

const grid = document.getElementById("commandGrid");
const sub = document.getElementById("subheadText");
const bangToggle = document.getElementById("bangToggle");
const searchInput = document.getElementById("searchInput");

let allSounds = [];
let defaultSubhead = "";

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {}

  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.left = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (err) {
    return false;
  }
}
  
function showCopyFeedback(el, originalSound, ok, copiedValue) {
  el.textContent = ok ? `Copied: ${copiedValue}` : `Copy failed`;
  el.classList.add("copied");

  setTimeout(() => {
    el.textContent = originalSound;
    el.classList.remove("copied");
  }, 900);
}

function renderSounds(filter = "") {

  const query = filter.toLowerCase();

  const filtered = !query
    ? allSounds
    : allSounds.filter(s => s.toLowerCase().includes(query));

  grid.innerHTML = "";

  filtered.forEach(sound => {

    const el = document.createElement("button");
    el.type = "button";
    el.className = "cmd";
    el.textContent = sound;

    el.addEventListener("click", async function () {

      const copiedValue =
        bangToggle && bangToggle.checked
        ? `!${sound}`
        : sound;

      const ok = await copyText(copiedValue);
      showCopyFeedback(el, sound, ok, copiedValue);

    });

    grid.appendChild(el);

  });

  if (query) {
    sub.textContent = `${filtered.length} match${filtered.length===1 ? "" : "es"}`;
  } else {
    sub.innerHTML = defaultSubhead;
  }
  
function parse() {

  const sourceSounds = SOUND_SOURCE
    .split("\n")
    .map(x => x.trim())
    .filter(Boolean);

  const total = sourceSounds.length;
  const latest = sourceSounds[sourceSounds.length - 1];

  allSounds = [...sourceSounds].sort((a, b) =>
    a.localeCompare(b, undefined, { sensitivity:"base", numeric:true })
  );

  defaultSubhead = `Click on a bubble to copy it to the clipboard.
  Last Update: ${total} — <span class="latestSound">${latest}</span>`;
  
  sub.innerHTML = defaultSubhead;

  renderSounds();

  searchInput.addEventListener("input", e => {
    renderSounds(e.target.value);
  });

}

try {
  parse();
} catch (err) {
  console.error("Parse failed:", err);
  sub.textContent = "Could not load sounds.";
}
